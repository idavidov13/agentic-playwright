name: Quarantine report
on:
    schedule:
        - cron: '0 8 * * 1-5'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    report:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --prefer-offline
            - run: node lint/quarantine-report.mjs
