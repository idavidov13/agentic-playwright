name: Template Smoke Test

# Runs the real initializer end-to-end on every PR: pack the npm package,
# scaffold a project from the tarball, and verify the generated project
# passes its own quality gates. The live demo-API smoke test runs too, but
# is non-blocking — demo API downtime must not fail the build (deterministic
# checks above it are the gate).

on:
    pull_request:
    push:
        branches: [main]

jobs:
    template-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Pack the initializer (runs prepack -> bundles template/)
              working-directory: packages/create-agentic-playwright
              run: npm pack

            - name: Scaffold a project from the tarball
              run: |
                  mkdir -p /tmp/smoke && cd /tmp/smoke
                  tar -xzf "$GITHUB_WORKSPACE"/packages/create-agentic-playwright/create-agentic-playwright-*.tgz
                  node package/bin/create.js demo-project --demo --skip-browsers --skip-smoke

            - name: Generated project — TypeScript, ESLint, Prettier
              working-directory: /tmp/smoke/demo-project
              run: |
                  npx tsc --noEmit
                  npx eslint .
                  npx prettier --check .

            - name: Generated project — the eight skill gates + version gate
              working-directory: /tmp/smoke/demo-project
              run: |
                  npm run check:skills
                  npm run check:version

            # API only: the demo site's UI is behind Cloudflare bot protection,
            # which challenges datacenter IPs — UI tests can never pass from CI.
            - name: Generated project — live demo-API test (non-blocking)
              working-directory: /tmp/smoke/demo-project
              continue-on-error: true
              run: |
                  npx playwright install --with-deps chromium
                  npx playwright test --project=api

            # Pruned variants: without the Claude Code tree the gates lint the
            # generated .agents/skills copy; without .agents/ they lint the
            # canonical tree. --skip-git: the gates must not need a repository.
            - name: Pruned variant — no Claude Code tree
              run: |
                  cd /tmp/smoke
                  node package/bin/create.js no-claude --demo --no-claude --skip-install --skip-git
                  cd no-claude
                  bash scripts/check-agents-md.sh
                  bash scripts/check-skills-sync.sh
                  bash scripts/check-skill-shape.sh
                  bash scripts/sync-upstream-skills.sh verify
                  bash scripts/check-rules-drift.sh
                  bash scripts/check-skill-references-drift.sh
                  bash scripts/check-heading-pointers.sh
                  bash scripts/check-skill-crossrefs.sh

            - name: Pruned variant — no .agents tree, no Copilot prompt
              run: |
                  cd /tmp/smoke
                  node package/bin/create.js no-agents --demo --no-agents --no-copilot --skip-install --skip-git
                  cd no-agents
                  bash scripts/check-agents-md.sh
                  bash scripts/check-skills-sync.sh
                  bash scripts/check-skill-shape.sh
                  bash scripts/sync-upstream-skills.sh verify
                  bash scripts/check-rules-drift.sh
                  bash scripts/check-skill-references-drift.sh
                  bash scripts/check-heading-pointers.sh
                  bash scripts/check-skill-crossrefs.sh
